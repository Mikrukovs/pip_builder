# Конфигурация Nginx для production с WebSocket поддержкой
# Скопируйте в /etc/nginx/sites-available/proto-builder.ru

server {
    listen 80;
    server_name proto-builder.ru www.proto-builder.ru;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proto-builder.ru www.proto-builder.ru;

    # SSL сертификаты (от Certbot)
    ssl_certificate /etc/letsencrypt/live/proto-builder.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proto-builder.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Логи
    access_log /var/log/nginx/proto-builder.access.log;
    error_log /var/log/nginx/proto-builder.error.log;

    # Основное приложение
    location / {
        proxy_pass http://localhost:8888;
        proxy_http_version 1.1;
        
        # Заголовки для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
        
        # Отключение буферизации для WebSocket
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Специальная настройка для Socket.IO (если нужно)
    location /api/socket/ {
        proxy_pass http://localhost:8888;
        proxy_http_version 1.1;
        
        # WebSocket заголовки
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличенные таймауты
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 86400;
        
        # Отключение буферизации
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
